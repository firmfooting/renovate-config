# The org's conventional PR title check; the check itself, and why it exists,
# live in firmfooting/.github's pr-title.yml so every repository runs the same one.
name: PR title

on:
  pull_request:
    # `edited` matters: a title fixed after the fact must re-run the check.
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    permissions: {}
    uses: firmfooting/.github/.github/workflows/pr-title.yml@b42e6a19ea7bb68439f4d9a632f16f4fd6ab7338 # v1.6.0
    with:
      runner: avrea-ubuntu-24.04-2-vcpu
