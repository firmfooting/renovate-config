# The org's workflow security audit; the check itself, and why it exists, live
# in firmfooting/.github's zizmor.yml so every repository runs the same one.
name: Workflow security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/zizmor.yml@0483c28e4ee831016b803c0abcb3f72e1a5cd79b # v1.3.0
