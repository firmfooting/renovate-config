# The org's workflow security audit; the check itself, and why it exists, live
# in firmfooting/.github's zizmor.yml so every repository runs the same one.
name: Workflow security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/zizmor.yml@b42e6a19ea7bb68439f4d9a632f16f4fd6ab7338 # v1.6.0
    with:
      runner: avrea-ubuntu-24.04-2-vcpu
