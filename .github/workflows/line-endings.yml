# The org's line-ending rule; the check itself, and why it exists, live in
# firmfooting/.github's line-endings.yml so every repository runs the same one.
name: Line endings

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  line-endings:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/line-endings.yml@0483c28e4ee831016b803c0abcb3f72e1a5cd79b # v1.3.0
