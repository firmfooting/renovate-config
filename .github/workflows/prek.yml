# The org's git-hook gate: every hook in .pre-commit-config.yaml over the whole
# tree. The job itself lives in firmfooting/.github's prek.yml so every
# repository runs the same one.
name: prek

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  prek:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/prek.yml@0483c28e4ee831016b803c0abcb3f72e1a5cd79b # v1.3.0
