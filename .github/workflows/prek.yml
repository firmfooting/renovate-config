# The org's git-hook gate: every hook in .pre-commit-config.yaml over the whole
# tree. The job itself lives in firmfooting/.github's prek.yml so every
# repository runs the same one.
name: prek

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  prek:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/prek.yml@b42e6a19ea7bb68439f4d9a632f16f4fd6ab7338 # v1.6.0
